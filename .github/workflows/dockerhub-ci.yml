name: Build & Push Image

on:
  push:
    branches:
      - main
jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Started pushing Airflow image to Dockerhub"
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Debug filesystem
        run: |
          echo "PWD:"
          pwd
          echo "Repo root:"
          ls -la
          echo "Infra folder:"
          ls -la infra

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/airflow:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/airflow:${{ github.sha }}
            # --- NEW STEP: RUN THE PIPELINE ---
      
      - name: Run Data Cleaning Pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
              docker run --rm \
              -e AWS_ACCESS_KEY_ID \
              -e AWS_SECRET_ACCESS_KEY \
              ${{ secrets.DOCKERHUB_USERNAME }}/airflow:latest
