services:
  airflow:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: airflow-app
    volumes:
      - ../dags:/opt/airflow/dags
      - ../preprocessing:/opt/airflow/preprocessing

    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow
    ports:
      - "8080:8080"
    # env_file:
    #   - ../.env
    command: standalone
